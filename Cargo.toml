[package]
name = "codex-threads"
version = "0.1.0"
edition = "2024"
description = "A searchable CLI for local Codex session archives"
license = "MIT"
repository = "https://github.com/Andrew0613/codex-threads"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
